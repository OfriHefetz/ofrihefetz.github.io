<div class="card border-0 shadow-sm bg-white rounded-4 p-4 mb-4">
  <div class="row">
    <div class="col-md-6">
      <h3>Education</h3>

      {% for item in site.data.profile.education %}
      <div class="mb-4">
        <strong>{{ item.name }}</strong><br>
        <span>{{ item.position }}</span><br>
        <em>{{ item.date }}</em>
      </div>
      {% endfor %}
    </div>

    <div class="col-md-6">
      <h3>Experience</h3>

      {% for item in site.data.profile.experience %}
      <div class="mb-4">
        <strong>{{ item.name }}</strong><br>
        <span>{{ item.position }}</span><br>
        <em>{{ item.date }}</em>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
