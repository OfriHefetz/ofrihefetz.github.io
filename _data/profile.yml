short_bio: >-
  <p>
    I am a PhD student working at the intersection of mental health,
    audio analysis, and natural language processing.
  </p>
  <p>
    My research focuses on developing computational methods for identifying,
    monitoring, and evaluating mental-health-related signals from speech,
    language, and clinical interactions.
  </p>
  <p>
    I am especially interested in how vocal and linguistic markers can reveal
    information that is not always captured by traditional self-report questionnaires,
    and how interpretable machine learning can support clinical research and
    treatment evaluation.
  </p>

